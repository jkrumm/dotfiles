# ~/Library/Preferences/nsmb.conf — managed by dotfiles (smb/nsmb.conf, symlinked
# by `make smb-keepalive-setup`). User-level SMB client settings; /etc/nsmb.conf
# wins on conflict. Every key checked against nsmb.conf(5) on macOS 26.
[default]
# Soft mounts: an unreachable server returns an error instead of blocking every
# caller (Finder, stat, the keepalive probe) indefinitely.
soft=yes
# SMB3 only — the HomeLab server speaks nothing older; skips the downgrade dance.
protocol_vers_map=4
# Port 445 only, never fall back to NetBIOS (it isn't served, it only adds a
# timeout to every failed connect).
port445=no_netbios
# No multichannel: the server is reached over one Tailscale path, and extra
# channels to its other interfaces are exactly what doesn't survive a roam.
mc_on=no

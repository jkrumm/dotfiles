# How the factory ships this project (software-factory docs/design.md §9).
apiVersion: factory/v2
name: dotfiles
deploy:
  mode: make # `make deploy` converges this machine; `make verify` is the doctor
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 15m
  migrations: []
ship:
  - { paths: ["**"], via: push }
leads: 1
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z

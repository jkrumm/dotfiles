# How the factory ships this project (software-factory docs/design.md §9).
apiVersion: factory/v2
name: dotfiles
deploy:
  mode: make # `make deploy` converges this machine; `make verify` is the doctor
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 15m
  migrations: []
ship:
  - { paths: ["**"], via: push }
# Not a throttle: the host's memory and load and the `after` edges decide how many run. Rows that restart a shared host
# service (Postgres, the VM, the work stack) take the `host` lane. Two at a time: a lane holds an Issue for its whole
# build, not only for its restart, and at one a row waited hours behind another service's drained restart. Rows that
# restart the same service are chained with `after`.
# A stated cap is an exception (software-factory NL32: with no `leads` only the host's memory fit, load and the accounts
# limit). 8 left an Issue queued 170 of 820 min behind the repo claim; this repo ships by push, so there is no merge
# window and more leads cost only rebases on shared files. 16 is a step, not a ceiling: drop the line once the idle
# seat-hours on the claim stay near 0.
leads: 16
lanes:
  host: 2
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z

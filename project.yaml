# How the factory ships this project (software-factory docs/design.md §9).
apiVersion: factory/v2
name: dotfiles
deploy:
  mode: make # `make deploy` converges this machine; `make verify` is the doctor
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 15m
  migrations: []
ship:
  - { paths: ["**"], via: push }
# Four leads at once; rows that restart a shared host service (Postgres, the VM, the work stack) take the `host` lane, one at a time.
leads: 4
lanes:
  host: 1
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z

# The mini's service registry — every launchd job, container, VM and dev server on the Mac mini, with its tier,
# memory budget and start/stop verbs. docs/mini-registry.md has the format; `make mini-ps` reads it.
# A repo adds its own services in a `mini-services.yaml` at its root (same shape, `repo` defaults to the directory).
#
#   name        unique
#   repo        owner repo under ~/SourceRoot or ~/IuRoot
#   kind        launchd | compose | vm | static | dev-server
#   tier        core (always on) | on-demand (starts on the first request) | manual (a profile starts it)
#   profile     work | dev-db — for a manual service
#   needs       [vm] is the Colima VM of the service's own profile; else a service name
#   memory_mib  the budget; `make mini-ps` warns above it (physical footprint)
#   ports       TCP ports it listens on (127.0.0.1); two services claiming one fail the check
#   door        the Caddy registry name(s) it serves, as scripts/lib/caddy-registry.py yields them
#   label       launchd label (a brew service matches sh.brew.<n> and homebrew.mxcl.<n>); daemon: true for /Library/LaunchDaemons
#   container   compose container name (vm: the Colima profile, default if omitted)
#   idle_minutes  a dev server stops after this long with no request to its door (default 30; mini-apps/idle.ts)
#   start/stop  the owner's command; a launchd job without one gets launchctl bootstrap/bootout, a service with
#               neither refuses the verb. status: the owner's own status command, for the apps page
services:

# herdr — terminal workspace manager for AI coding agents
#
# Symlinked to ~/.config/herdr/config.toml on BOTH machines by `make setup`.
# Only the file is linked, never the directory: ~/.config/herdr also holds
# herdr.sock, herdr-client.sock and the rotating logs, which are machine-local
# runtime state and must not be tracked.
#
# It has to be identical on both because the config is read wherever the herdr
# process that renders is running, and that differs per entry path:
#   dev  (mosh)          → herdr runs ON THE MINI, renders there, streams over UDP
#   desk (herdr --remote) → the client runs on the MacBook and handles keys
#                           locally (--remote-keybindings defaults to `local`)
# One tracked file removes the question entirely.
#
# Apply changes to a running server without dropping panes:
#   herdr server reload-config      (or prefix+shift+R inside herdr)

# Onboarding was answered once; don't re-prompt on a fresh machine.
onboarding = false

[theme]
# One Dark / One Light, mirrored by config/ghostty/themes/one-{dark,light}.
# herdr paints its own chrome from this palette; pane CONTENT is painted from
# the outer terminal's ANSI palette. They only agree because both ends are set
# to One — that is the whole point of the pairing.
#
# `terminal` (inherit the host ANSI palette) is deliberately NOT used. On the
# `dev` path herdr renders on the mini, so it would have to negotiate the
# palette through mosh's UDP proxy. A named theme needs no negotiation and
# looks the same over both transports.
name = "one-dark"

# PINNED DARK, deliberately (2026-07-27). herdr does not follow the host
# terminal's light/dark appearance.
#
# The cost is real and worth stating: the TERMINAL still auto-switches
# (`theme = dark:one-dark,light:one-light` in config/ghostty/config.cmux), and
# herdr paints its own background rather than inheriting one. So if macOS ever
# flips to light, pane CONTENT goes light while herdr's chrome stays dark — a
# dark sidebar framing light panes. Pinning is only correct because light mode
# is not actually used here.
#
# What it buys: every color in the UI can be chosen for a dark background
# alone. Nothing has to clear a contrast bar on #fafafa it would never meet, so
# the vivid One Dark values are usable — see `branch` under [ui.sidebar.spaces].
#
# To go back to following appearance: set auto_switch = true and revert that
# branch color to #50a14f, which is the compromise value that survives both.
auto_switch = false
dark_name = "one-dark"
light_name = "one-light"

[terminal]
# $SHELL, then /bin/sh. Left empty on purpose: the mini and the MacBook should
# both just use zsh as configured, not a pinned absolute path that breaks if
# Homebrew's prefix ever moves.
default_shell = ""
shell_mode = "auto"

# New panes/tabs/workspaces inherit the source pane's cwd. With one workspace
# per repo this is what you want ~always; "home" means re-navigating every time.
new_cwd = "follow"

[worktrees]
# Kept out of the repos themselves so `git status` in a checkout never shows
# sibling worktrees and no repo needs a .gitignore entry for them.
directory = "~/.herdr/worktrees"

[keys]
prefix = "ctrl+b"

# Only two additions to the defaults, both lifted from herdr's own documented
# examples so the syntax is known-good. Everything else stays default — an
# unbound key costs nothing, a wrongly-bound one silently shadows a working
# default and is far more annoying to diagnose.
#
# Jump straight to a repo (workspace) or to a specific agent, without walking
# the picker. This is the ergonomic win when a dozen agents are live.
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

# Container TUI as a modal popup rather than burning a pane on it.
# lazydocker is declared in the Brewfile; lazygit deliberately is not, so it is
# not bound here — a binding to a missing binary just opens an empty popup.
[[keys.command]]
key = "prefix+alt+d"
type = "popup"
command = "lazydocker"
width = "90%"
height = "90%"

[ui]
# Hex, now that [theme] is pinned dark — this is One Dark's own blue, the exact
# value config/ghostty/themes/one-dark paints as palette 4, so herdr's accent
# and the terminal's blue are the same pixel. A named "blue" would resolve to
# whatever the active palette calls blue, which is close but not identical.
#
# This is only safe BECAUSE auto_switch is false. Turn it back on and this must
# return to "blue" — #61afef scores 2.26 on #fafafa.
accent = "#61afef"

sidebar_width = 30
sidebar_min_width = 20
sidebar_max_width = 40
sidebar_collapsed_mode = "compact"

# Borders + gaps: gaps cost one column per split but make it unambiguous which
# pane is focused, which matters when four agents are streaming at once.
pane_borders = true
pane_gaps = true

# A single-tab workspace has nothing to switch between, so the tab row is pure
# chrome. Reclaim the line; the new-tab binding still works.
hide_tab_bar_when_single_tab = true

# Grouped by workspace (= by repo). The alternative, "priority", reorders rows
# by attention state — better when triaging many idle agents, worse when you
# navigate by muscle memory because rows move under you.
agent_panel_sort = "spaces"

mouse_capture = true
copy_on_select = true
confirm_close = true

# Tabs get generated names instantly instead of prompting; workspaces still
# prompt, because a workspace name is what you later navigate by.
prompt_new_tab_name = false
prompt_new_workspace_name = true

[ui.sidebar.agents]
row_gap = 0
# Default rows, plus the agent name on its own line.
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
# Claude Code panes get a third line: the terminal title with Claude's own
# status decoration stripped, which is where the current task shows up. That
# turns the sidebar from "four agents are busy" into "which four things".
claude = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent"],
]

[ui.sidebar.spaces]
row_gap = 0
# Branch and dirty-state per workspace, so `rd repos` isn't needed to answer
# "did I leave that checkout dirty".
# `branch` is styled because herdr's contextual default for that token is
# PURPLE, which is not wanted. Inline token styles accept strict hex only, so
# this value cannot adapt — which is fine now that [theme] is pinned dark.
#
# #98c379 is One Dark's own green. Measured WCAG contrast on #282c34:
#
#   One Dark green   #98c379   6.94   ← this, only viable because we pinned dark
#   One Dark purple  #c678dd   4.75   (herdr's default)
#   One Light green  #50a14f   4.37   (the both-backgrounds compromise, dropped)
#
# It also matches starship's green branch, so the sidebar and the prompt name
# the branch in the same color. If auto_switch is ever turned back on, this
# MUST go back to #50a14f — #98c379 scores 1.93 on #fafafa, effectively invisible.
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "#98c379" }, "git_status"],
]

[ui.toast]
# In-app toasts. `terminal` and `system` would hand off to the OS notifier,
# which on the `dev` path means pushing an OSC sequence through mosh to reach
# the MacBook — unnecessary indirection when herdr can just draw it itself,
# and it renders identically over both transports.
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
# Audible state changes for background workspaces. Note this plays on whichever
# machine herdr RENDERS on — over mosh that is the mini, which is headless and
# usually out of earshot. Kept on because it costs nothing and is correct on the
# `desk` path; set false if the mini ever ends up somewhere you can hear it.
enabled = true

[session]
# Restore agent panes into their real conversations after a server restart
# rather than into a bare shell. Needs the official integration — installed by
# `make herdr-setup`, which is what makes panes report a session ref at all.
resume_agents_on_restore = true

[remote]
# herdr generates its own ssh config for `--remote`, but includes ~/.ssh/config
# FIRST, so this repo's ControlMaster/keepalive/SetEnv block on `Host mini`
# still wins. Leaving this true only adds its per-attach control socket on top.
manage_ssh_config = true

[update]
channel = "stable"
version_check = true
manifest_check = true

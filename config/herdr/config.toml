# herdr — terminal workspace manager for AI coding agents
#
# Symlinked to ~/.config/herdr/config.toml on BOTH machines by `make setup`.
# Only the file is linked, never the directory: ~/.config/herdr also holds
# herdr.sock, herdr-client.sock and the rotating logs, which are machine-local
# runtime state and must not be tracked.
#
# It has to be identical on both because the config is read wherever the herdr
# process that renders is running, and that differs per entry path:
#   dev  (mosh)           → herdr runs ON THE MINI, renders there, streams over UDP
#   desk (herdr --remote) → the client runs on the MacBook and handles keys
#                           locally (--remote-keybindings defaults to `local`)
#
# Deliberately near-stock. Everything herdr already defaults to is left out
# rather than restated, so this file is only the things that actually differ.
#
# Apply changes to a running server without dropping panes:
#   herdr config check            # unknown keys + TOML errors; NOT bad theme values
#   herdr server reload-config    # or prefix+shift+R inside herdr

[theme]
# Catppuccin, mirrored on the terminal side by ghostty's bundled
# "Catppuccin Mocha" / "Catppuccin Latte" (config/ghostty/config.cmux).
#
# Chosen over One Dark on measured evidence, not taste. herdr marks the focused
# workspace row by painting a background; in most themes it leaves the sidebar
# itself transparent, so that highlight is the ONLY painted surface and it lands
# on the theme's own background colour — which is exactly what the matching
# terminal theme paints as ITS background. Result: the active row is invisible.
# Measured, by capturing a herdr client in a pty per theme:
#
#   theme          sidebar bg      active row     visible?
#   catppuccin     #181825 mantle  #1E1E2E base   YES — two distinct tiers
#   vesper         #101010         #1A1A1A        yes
#   one-dark       (transparent)   #282C34        no — equals terminal bg
#   tokyo-night    (transparent)   #1A1B26        no
#   nord           (transparent)   #2E3440        no
#   gruvbox / solarized / kanagawa / rose-pine / dracula   same collision
#
# That Catppuccin is the exception is structural, not luck: herdr's whole
# [theme.custom] token set IS Catppuccin's vocabulary — surface0, surface1,
# surface_dim, overlay0, overlay1, text, subtext0, mauve, peach, teal. The
# engine is Catppuccin-native and the other themes are mappings onto it that
# collapse the surface tiers. Picking Catppuccin means zero colour overrides.
name = "catppuccin"

# Follow the host terminal's reported light/dark appearance. herdr probes with
# OSC 10/11 + DEC mode 2031 (confirmed in a pty capture); on the `desk` path the
# client is local so this is reliable, over mosh the probe may not survive the
# UDP proxy, in which case `name` above is the fallback.
#
# This is also why nord, dracula and vesper are not options here: herdr ships no
# light sibling for any of them, so auto_switch has nothing to switch TO.
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[ui.sidebar.spaces]
# The single override in this file. herdr renders the `branch` token in the
# theme's mauve slot, and that is universal rather than a Catppuccin quirk —
# measured as #CBA6F7 (catppuccin), #C678DD (one-dark), #BB9AF7 (tokyo-night),
# #B48EAD (nord). No theme choice avoids it; only an explicit style does.
#
# Inline token styles accept strict hex only, so this one value cannot adapt and
# must survive both appearances alone. #40a02b is Catppuccin Latte's green:
# 4.91 contrast on Mocha's #1e1e2e, 2.96 on Latte's #eff1f5 — the second is a
# hair under the 3.0 target and is the honest cost of one hex serving two
# backgrounds. Latte teal #179299 measures better (4.38 / 3.31) if the light-mode
# reading ever bothers you; green is used because starship renders the branch
# green too, so the sidebar and the prompt agree.
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "#40a02b" }, "git_status"],
]

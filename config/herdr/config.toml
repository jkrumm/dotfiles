# herdr — terminal workspace manager for AI coding agents
#
# Symlinked to ~/.config/herdr/config.toml on BOTH machines by `make setup`.
# Only the file is linked, never the directory: ~/.config/herdr also holds
# herdr.sock, herdr-client.sock and the rotating logs, which are machine-local
# runtime state and must not be tracked.
#
# It has to be identical on both because the config is read wherever the herdr
# process that renders is running, and that differs per entry path:
#   dev  (mosh)           → herdr runs ON THE MINI, renders there, streams over UDP
#   desk (herdr --remote) → the client runs on the MacBook and handles keys
#                           locally (--remote-keybindings defaults to `local`)
#
# Deliberately near-stock: a [theme] block and one colour override. Everything
# herdr already defaults to is left out rather than restated.
#
# Apply changes to a running server without dropping panes:
#   herdr config check            # unknown keys + TOML errors; NOT bad theme values
#   herdr server reload-config    # or prefix+shift+R inside herdr

[theme]
# One Dark / One Light for herdr's CHROME. The terminal deliberately does NOT
# match — it runs the neutral zinc pair (config/ghostty/themes/zinc-{dark,light}).
#
# That mismatch is the design, not an oversight, and it is what an earlier
# version of this file got wrong. herdr marks the focused workspace row by
# painting a background and, in one-dark, leaves the sidebar itself transparent.
# So the highlight is the only painted surface, and it lands on one-dark's own
# #282C34. Set the TERMINAL to One Dark too and that is also the terminal's
# background: the active row renders backdrop-on-backdrop and looks unfocused.
# Matching the palettes is precisely what breaks it.
#
# Measured separation of herdr's active row #282C34 against terminal backgrounds:
#
#   zinc-dark   #09090b   1.42  ✓ clear      ← what we use
#   zinc-900    #18181b   1.27  ✓ clear
#   basalt-ui   #1c2127   1.16  ~ faint
#   One Dark    #282c34   1.00  ✗ invisible
#
# THE CONSTRAINT IS THE TERMINAL'S DARK BACKGROUND, and it lives in
# config/ghostty/themes/zinc-dark. Lighten it past ~#1a1d23 and this highlight
# quietly degrades with nothing in any log to say so.
name = "one-dark"

# Follow the host terminal's reported light/dark appearance. herdr probes with
# OSC 10/11 + DEC mode 2031 (confirmed in a pty capture); on the `desk` path the
# client is local so this is reliable, over mosh the probe may not survive the
# UDP proxy, in which case `name` above is the fallback — hence it is the dark
# member rather than unset.
#
# Light mode needs no help: `one-light` paints its own sidebar (#F5F5F6)
# distinct from its active row (#FAFAFA), so the highlight works there whatever
# the terminal does. Only one-dark has the transparent-sidebar dependency.
auto_switch = true
dark_name = "one-dark"
light_name = "one-light"

[ui.sidebar.spaces]
# The single override in this file. herdr renders the `branch` token in the
# theme's mauve slot, and that is universal rather than a one-dark quirk —
# measured as #C678DD (one-dark), #CBA6F7 (catppuccin), #BB9AF7 (tokyo-night),
# #B48EAD (nord). No theme choice avoids the purple; only an explicit style does.
#
# Inline token styles accept strict hex only, so this value cannot adapt and has
# to clear both surfaces it can land on: the terminal's #09090b in dark mode
# (sidebar transparent) and herdr's own #F5F5F6 in light mode. #2f8f5b measures
# 4.93 and 3.71 — the best worst-case of the greens tried (#4d9375 → 3.35,
# #40a02b → 3.07). Green because starship renders the branch green too, so the
# sidebar and the prompt agree.
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "#2f8f5b" }, "git_status"],
]

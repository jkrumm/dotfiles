# herdr — terminal workspace manager for AI coding agents
#
# Symlinked to ~/.config/herdr/config.toml on BOTH machines by `make setup`.
# Only the file is linked, never the directory: ~/.config/herdr also holds
# herdr.sock, herdr-client.sock and the rotating logs, which are machine-local
# runtime state and must not be tracked.
#
# It has to be identical on both because the config is read wherever the herdr
# process that renders is running, and that differs per entry path:
#   dev  (mosh)           → herdr runs ON THE MINI, renders there, streams over UDP
#   desk (herdr --remote) → the client runs on the MacBook and handles keys
#                           locally (--remote-keybindings defaults to `local`)
#
# Deliberately near-stock: a [theme] block and one colour override. Everything
# herdr already defaults to is left out rather than restated.
#
# Apply changes to a running server without dropping panes:
#   herdr config check            # unknown keys + TOML errors; NOT bad theme values
#   herdr server reload-config    # or prefix+shift+R inside herdr

# Written by herdr ITSELF the first time a server runs against this file, which
# on a symlinked config means it appears here as an uncommitted diff rather than
# in some machine-local state file. Tracked deliberately: it is the correct
# value on both machines, and leaving it untracked means it silently reappears
# as noise in `git status` on every fresh install. Must stay above [theme] —
# TOML top-level keys cannot follow a table header.
onboarding = false

[theme]
# One Dark / One Light for herdr's CHROME. The terminal runs One Zinc
# (config/ghostty/themes/one-zinc-{dark,light}) — the same Atom One hue family,
# muted, on basalt-ui zinc surfaces. They agree without being the same file.
#
# HOW THE SIDEBAR ACTUALLY RENDERS (measured, not assumed — pty capture of a
# herdr client with three workspaces, one focused, both themes):
#
#              focused row          unfocused rows
#   one-dark   bg #282C34, fg #ABB2BF, bold    no bg, fg #969CA8, regular
#   one-light  bg #F5F5F6, fg #383A42, bold    no bg, fg #686B77, regular
#
# The sidebar itself is never painted in either theme, so the focused row's
# background lands directly on the TERMINAL's background. But it is one of three
# cues — background, brighter foreground, and bold — which is why that
# background may be subtle. Current separation: 1.17 dark, 1.03 light.
#
# An earlier revision of this file believed the background was the only cue and
# drove the terminal to near-black (#09090b) to maximise it. That is where the
# "black black" terminal came from. Do not reintroduce that trade.
#
# Also measured, and the reason there is no per-mode surface override below:
# [theme.custom] is a SINGLE GLOBAL BLOCK (herdr's ThemeConfig is
# `{name, auto_switch, dark_name, light_name, custom}` — one `custom`, read out
# of the 0.8.0 binary). It applies to whichever theme is active, so it cannot
# hold one value for light and another for dark.
#
# "A row highlight that works on both canvases does not exist" was asserted
# here for months. It is now MEASURED, and it holds — but for the opposite
# reason to the one implied. Sweeping every grey for the best worst-case of
# {row vs #1f1f23, row vs #f2f2f5, one-dark text on row, one-light text on
# row}, the optimum is #707076 at 2.30. The row itself becomes far more
# visible than either theme manages (3.34 / 4.40 against 1.17 / 1.03) — and
# the row's own LABEL collapses from 6.57 / 10.41 to 2.30, i.e. the focused
# row turns into the least legible line in the sidebar. That is a worse trade,
# so the terminal background, which ghostty does switch per mode, stays the
# differentiator.
name = "one-dark"

# Follow the host terminal's reported light/dark appearance. THE SIGNAL IS DEC
# MODE 2031, AND ONLY THAT — measured by driving herdr in a pty three times and
# varying only the reply:
#
#   probe answered                    focused row   theme
#   nothing                           #282C34       one-dark (fallback)
#   OSC 10/11 with a light background #282C34       one-dark — NO EFFECT
#   CSI ?2031h -> CSI ?997;2n         #F5F5F6       one-light
#
# herdr does query OSC 10/11, which is why an earlier version of this comment
# credited them. They do not drive the theme. What does is an UNSOLICITED
# terminal notification: herdr sends `CSI ?2031h` and waits for the terminal to
# volunteer `CSI ?997;1n` (dark) / `;2n` (light). Debugging this means asking
# whether that report arrives, not what the background colour is.
#
# WHICH MEANS THE ENTRY PATH DECIDES, because the two paths render in different
# places and only one has a terminal in front of it:
#
#   desk (herdr --remote) → the client reads the report straight from cmux and
#                           FORWARDS IT AS RAW BYTES: on unix the client sends
#                           `ClientMessage::Input { data }` and the SERVER
#                           parses it (`InputEvents`, the structured path that
#                           drops HostColorSchemeChanged, is for Windows
#                           clients only). So the theme follows the Mac even
#                           though the chrome is rendered on the mini. cmux
#                           does volunteer the report — it is libghostty, and
#                           carries ghostty_surface_set_color_scheme plus an
#                           inline color_scheme_report path.
#   dev  (mosh)           → client renders ON THE MINI. The enable has to cross
#                           mosh to Ghostty and the report has to come back, and
#                           mosh is a state-synchronizing emulator with its own
#                           terminal model rather than a byte tunnel. Presumed
#                           swallowed — not measured, since it cannot be
#                           reproduced from the mini alone.
#
# So `name` below is the no-report fallback, and there is no value that is right:
# the MacBook auto-switches with the time of day, and the mini is headless (every
# mosh session originates from the MacBook anyway, so its own appearance never
# matters). Dark is kept as the coin-flip. The actual fix for a light-mode
# MacBook is to come in via `desk`, where the probe is not proxied at all.
#
# Both themes behave the same way (see the table above) — an earlier note here
# claimed one-light painted its own sidebar and so needed no care. It does not;
# one-light is transparent exactly like one-dark, it just paints the focused row
# #F5F5F6 instead of #282C34.
auto_switch = true
dark_name = "one-dark"

# LIGHT IS NOT one-light, AND THAT IS THE WHOLE POINT OF THIS PAIRING.
# one-light's surface_dim is #f5f5f6 — against the one-zinc-light terminal
# (#f2f2f5) that is a contrast of 1.03, i.e. the focused row is painted and
# invisible, leaving bold + a brighter foreground as the only cues. Dark got
# away with the same weakness (one-dark #282c34, 1.17) because #282c34 against
# a near-black terminal still reads as a block; a near-white block on a
# near-white terminal does not.
#
# Every light theme herdr ships, focused-row surface_dim vs #f2f2f5:
#
#   kanagawa-lotus    #d5cea3   1.43   warm beige — fights the zinc surfaces
#   tokyo-night-day   #d2d3da   1.34   cool neutral grey
#   gruvbox-light     #f2e5bc   1.12
#   solarized-light   #eee8d5   1.10
#   catppuccin-latte  #e6e9ef   1.09
#   rose-pine-dawn    #f2e9e1   1.07
#   one-light         #f5f5f6   1.03   (was here)
#
# tokyo-night-day wins on the only two axes that matter together: it is the
# best of the cool-neutral options, so it sits on a zinc surface without a
# colour cast, and it is 1.34 rather than 1.03. kanagawa-lotus is the higher
# number and was rejected on hue — beige on zinc is a different mistake, not a
# smaller one. The cost is that light mode no longer shares one-dark's Atom One
# hues; its row LABEL also drops from 10.41 to 3.92 on the highlight, which is
# still comfortably legible, and unfocused rows are unchanged (subtext 4.14 vs
# one-light's 4.75).
#
# Revert is this one line. `light_name = "one-light"` restores the matched pair.
light_name = "tokyo-night-day"

[ui]
# Tuned for MANY workspaces. Everything here is a departure from a default that
# is fine at three spaces and stops being fine at twenty.
#
# agent_panel_sort: default "spaces" groups the agent list by workspace, which
# duplicates the spaces list directly above it — the sidebar renders the section
# header as `grouped`. "priority" turns it into an attention queue instead, so
# the agent that is blocked on input rises to the top rather than sitting
# wherever its repo happens to sort. The one setting here that changes what you
# LOOK AT rather than how much space it takes.
agent_panel_sort = "priority"

# One tab per workspace is the normal shape here, so the tab row is a constant
# reminder of a dimension not in use. It only hides at exactly one tab; creating
# a second brings the row back, and the keybinding still works when hidden.
hide_tab_bar_when_single_tab = true

# With claude and a terminal or two in one workspace, the borders are the only
# thing distinguishing the panes. This is what labels them. Manual pane names
# still win. (Until 2026-08-04 the herdr-notes pane named itself via
# `pane rename`; the note is a popup now, so nothing else is self-labelling.)
show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
# BRANCH IS DROPPED. herdr's built-in space tokens are state_icon, state_text,
# workspace, branch and git_status (confirmed against the reference config
# embedded in the 0.7.5 binary), and its DEFAULT rows are literally
#   [["state_icon", "workspace"], ["branch", "git_status"]]
# — so this block is not a tweak of the default, it IS the default minus one
# token. It has to stay: deleting the block restores branch rather than removing
# it. That is the trap if this ever looks redundant.
#
# Why drop it: the branch is already in the prompt of every pane inside the
# workspace, and starship renders it there with more context (ahead/behind,
# stash). In the sidebar it was one more column of text on a row that is mostly
# scanned for *which repo*, not which branch.
#
# This retires the file's one colour override along with it. Kept here because
# the reasoning generalises to any token restored later: herdr renders `branch`
# in the theme's MAUVE slot, and that is universal rather than a one-dark quirk —
# measured as #C678DD (one-dark), #CBA6F7 (catppuccin), #BB9AF7 (tokyo-night),
# #B48EAD (nord). No theme choice avoids the purple; only an explicit style does.
# Inline styles accept strict hex, so such a value cannot adapt per mode and must
# clear both terminal backgrounds (#1f1f23 dark, #f2f2f5 light) — #358a5c was the
# best worst-case green tried, at 3.86 / 3.80.
rows = [
  ["state_icon", "workspace"],
  ["git_status"],
]

[ui.sidebar.agents]
# Same edit as the spaces block above, same reason. herdr's default is
#   [["state_icon", "workspace", "tab"], ["agent"]]
# and the `agent` token renders the detected agent's name — which is `claude`
# for every single row, because that is the only agent used here. At twenty
# workspaces that is twenty lines spelling out a constant. The state_icon
# already carries the information that actually varies.
#
# Restore `["agent"]` the day a second agent kind shows up (codex, gemini and
# friends are all in herdr's detection manifest); until then it is a caption on
# a photo of itself. `state_text` is the other candidate for that second row if
# the spinner glyph ever proves too subtle.
rows = [["state_icon", "workspace", "tab"]]

[keys]
# HYPER IS A HELD PREFIX. Every binding below is the letter herdr already uses
# after `prefix`, with Caps Lock held instead of the prefix tapped first:
# `ctrl+b b` and `Caps+b` do the same thing. That is the whole design — nothing
# new to memorise, one motion instead of two, and the prefix keeps working.
#
# Caps Lock becomes ⌃⌥⇧ via Karabiner-Elements — the rule is
# config/karabiner/karabiner.json, installed by `_setup-karabiner`. Without it
# every chord here is simply inert and the `prefix+` half still works, so this
# block is safe on a machine that never sets it up.
#
# NOT HYPERKEY, AND NOT A PREFERENCE. Hyperkey was tried first and never
# intercepted a single Caps Lock key-down on the mini, with both Bedienungshilfen
# and Eingabeüberwachung granted. The cause is structural: Hyperkey drives a
# CGEventTap, and on macOS 26 a CGEventTap no longer receives events from
# EXTERNAL keyboards. A Mac mini has no other kind. Karabiner grabs the device
# at HID level instead — `hid queue value monitor is started (grabbed)` in
# /var/log/karabiner/core_service.log is the line that confirms it.
#
# THREE MODIFIERS, NOT FOUR — CMD IS DELIBERATELY DROPPED. The "hyper key"
# convention is all four (⌃⌥⇧⌘). Measured with a raw-byte probe in a bare
# Ghostty window, after the Karabiner rule was live:
#
#   plain b     -> `b`, then CSI-u `98;1:3u`   (mods=0, release event)
#   Caps+b      -> CSI-u `98;8:3u`             (mods=7 = shift+alt+ctrl)
#
# So Ghostty encodes a three-modifier chord through the Kitty protocol exactly
# as needed. What is NOT established is that it ever emits the super/cmd bit —
# macOS terminals traditionally never send ⌘ to the pty, and no capture here
# ever showed bit 8. Dropping cmd also keeps Ghostty's own ⌘ binds intact;
# most `super+<letter>` chords are bound by default, copy and paste included.
# Still collision-free: nothing in the shell, in Claude Code, or in Ghostty's
# 93 defaults uses `ctrl+alt+<letter>`.
#
# NEVER WRITE `hyper+X`. The trap, and it is silent. herdr really does know
# `hyper` as a modifier — it is Kitty keyboard protocol bit 16, and the parser
# is genuinely validating rather than permissive (measured: `frobnicate+b`,
# `ctrl+notakey` and `zzzz` are all REJECTED, while `hyper+b` and `meta+b` are
# accepted). But macOS has no Hyper modifier and cannot produce bit 16 — every
# remapper emits real flags, Karabiner included. So `hyper+X` passes
# `config check` and never fires.
#
# WHY THIS IS THE `desk` PATH ONLY, and why the prefix stays. Measured in a pty,
# not assumed:
#
#   herdr pushes `CSI > 7 u` on startup — the Kitty keyboard protocol, flags
#   1+2+4 (disambiguate escape codes, report event types, report alternate
#   keys). That push is what lets a modified chord be encoded at all.
#   herdr's own docs claim it does not implement the protocol. The capture says
#   otherwise; believe the capture.
#
#   mosh SWALLOWS that push (captured client-side with a passing visible-text
#   control, so the zero is real and not a broken harness). Same mechanism, and
#   now the same measurement, as the DEC 2031 theme probe in the [theme] block
#   above — mosh is a state-synchronising emulator, not a byte tunnel, so any
#   capability negotiated by escape sequence never reaches Ghostty.
#
# So the rule is NOT "desk only" — it is "anything except mosh". Hyper works
# wherever the keys are handled by a client talking straight to Ghostty:
# `desk` (herdr --remote, client on the MacBook), and equally sitting at the
# mini headful, which is actually the cleanest case of all since there is no
# transport in the path at all. Only `dev` (mosh) falls back to the prefix,
# which is fine — mosh is the travel path.
#
# `ctrl+alt+X` (no shift) was the other candidate and is deliberately NOT bound
# as a third alias. It is genuinely free and it does survive mosh — but the
# prefix already covers the mosh path, so it would add a third way to do
# everything and buy nothing.

# Panes — the biggest daily win: no prefix dance to move between claude, notes
# and a terminal in the same workspace.
focus_pane_left  = ["prefix+h", "ctrl+alt+shift+h"]
focus_pane_down  = ["prefix+j", "ctrl+alt+shift+j"]
focus_pane_up    = ["prefix+k", "ctrl+alt+shift+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+shift+l"]
zoom             = ["prefix+z", "ctrl+alt+shift+z"]
split_vertical   = ["prefix+v", "ctrl+alt+shift+v"]
close_pane       = ["prefix+x", "ctrl+alt+shift+x"]

# Workspaces and tabs.
workspace_picker = ["prefix+w", "ctrl+alt+shift+w"]
goto             = ["prefix+g", "ctrl+alt+shift+g"]
toggle_sidebar   = ["prefix+b", "ctrl+alt+shift+b"]
new_tab          = ["prefix+c", "ctrl+alt+shift+c"]
next_tab         = ["prefix+n", "ctrl+alt+shift+n"]
previous_tab     = ["prefix+p", "ctrl+alt+shift+p"]

# Project note — opens THIS pane's repo page from the brain vault in $EDITOR.
# scripts/brain-note.sh resolves the repo via `git rev-parse --show-toplevel`
# and opens (or creates) `Projects/<repo>.md`. See CLAUDE.md → "Notes".
#
# THIS REPLACED THE herdr-notes PLUGIN, and the reasoning is in the script's
# header: that plugin's note was untracked, unsynced, unbackuped and keyed to a
# workspace id, sitting next to a git-backed Obsidian vault on the same disk.
# The keybinding was the only part worth keeping.
#
# `prefix+e` is unchanged because every obvious mnemonic is already a 0.7.5
# default: `n` is next_tab, `shift+n` is new_workspace, `w`/`shift+w` are
# workspace navigate and rename. `e` is free.
#
# `popup` rather than a docked pane — measured from the binary, herdr's
# CommandKeybindType is exactly {shell, pane, popup, plugin_action}. A popup is
# session-modal and closes when the command exits, so the note is a thing you
# open and dismiss rather than a column permanently eating pane width, which is
# what made the docked plugin pane tiresome. `pane` (temporary zoomed pane) is
# the other reasonable choice if a popup ever feels too transient.
#
# Still safe in a file symlinked to BOTH machines, and now for a simpler reason
# than before: it is a plain command, so there is no plugin to be missing. The
# script refuses with a readable message when the pane is not in a repo — and
# pauses on the way out, because a popup closes the instant the command exits
# and an unpaused error is a flash of text nobody can read.
#
# Custom commands are spawned by the SERVER, so on the `desk` path — client on
# the MacBook, server on the mini — this edits the mini's vault checkout. Both
# machines hold one and brain-sync reconciles them through GitHub every 5
# minutes, so that is the right file either way.
#
# The array form works on `keys.command` too, and it is really supported rather
# than silently dropped — verified by putting a bogus key INSIDE the array and
# watching the checker reject that element specifically.
[[keys.command]]
key = ["prefix+e", "ctrl+alt+shift+e"]
type = "popup"
command = "exec bash \"$HOME/SourceRoot/dotfiles/scripts/brain-note.sh\""
description = "project note"
width = "80%"
height = "80%"

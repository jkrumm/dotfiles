# LiteLLM proxy — Anthropic↔OpenAI bridge for the IU unified endpoint.
#
# Lets `claude -p` (Anthropic Messages API) drive models that IU exposes only on
# its OpenAI-compatible transport — primarily DeepSeek-V4-Pro (EU/GDPR, Azure Spain).
# Started as a LaunchAgent via litellm/bin/start-litellm.sh, which injects
# IU_API_KEY + IU_OPENAI_BASE_URL from the macOS Keychain and forces the
# chat/completions route. Full background: docs/deepseek-litellm-bridge.md.
#
# Selection is by the `model` field; every entry is EU/GDPR-resident on the IU
# OpenAI transport. Never hardcode the IU base URL or key here — both arrive via
# os.environ (Keychain-sourced in the wrapper) so this file stays secret-free.

model_list:
  # Primary worker (coding/smart). Exact casing is mandatory — the IU gateway 404s
  # on a wrong-case model name (was the `kimi-k2.6` gotcha; same applies here).
  - model_name: DeepSeek-V4-Pro
    litellm_params:
      model: openai/DeepSeek-V4-Pro
      api_base: os.environ/IU_OPENAI_BASE_URL
      api_key: os.environ/IU_API_KEY
  # Fast/cheap auxiliary (replaced gpt-5-mini). EU (Azure Spain).
  - model_name: DeepSeek-V4-Flash
    litellm_params:
      model: openai/DeepSeek-V4-Flash
      api_base: os.environ/IU_OPENAI_BASE_URL
      api_key: os.environ/IU_API_KEY
  # GDPR-resident failover targets for the two DeepSeek tiers.
  - model_name: claude-sonnet-4-6-eu
    litellm_params:
      model: openai/claude-sonnet-4-6-eu
      api_base: os.environ/IU_OPENAI_BASE_URL
      api_key: os.environ/IU_API_KEY
  - model_name: claude-haiku-4-5-eu
    litellm_params:
      model: openai/claude-haiku-4-5-eu
      api_base: os.environ/IU_OPENAI_BASE_URL
      api_key: os.environ/IU_API_KEY
  # Back-compat alias: sideclaw selects its worker model in its own repo and may
  # still request Kimi-K2.6 until updated there. Keep it mapped so those calls
  # don't 404 mid-transition. (Single-backend Azure Sweden, throttle-prone.)
  - model_name: Kimi-K2.6
    litellm_params:
      model: openai/Kimi-K2.6
      api_base: os.environ/IU_OPENAI_BASE_URL
      api_key: os.environ/IU_API_KEY

litellm_settings:
  # `claude -p` sends reasoning_effort and other params some models reject — drop them.
  drop_params: true
  num_retries: 2
  request_timeout: 600
  # Transparent failover to the GDPR-resident Claude aliases.
  fallbacks:
    - DeepSeek-V4-Pro: ["claude-sonnet-4-6-eu"]
    - DeepSeek-V4-Flash: ["claude-haiku-4-5-eu"]
    - Kimi-K2.6: ["claude-sonnet-4-6-eu"]
  # Per-request usage → JSONL for usage-tracker. usage_logger.py is symlinked
  # next to this file (~/.config/litellm/) by `make` so litellm resolves it.
  callbacks: ["usage_logger.usage_logger_instance"]

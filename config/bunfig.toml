# Global Bun config — managed in dotfiles (config/bunfig.toml → ~/.bunfig.toml).
#
# Supply-chain hardening. Bun is the package manager for every SourceRoot repo,
# so this is the single highest-value lockdown for this machine. Bun already
# blocks dependency lifecycle (postinstall) scripts by default — opt specific
# packages back in via `trustedDependencies` in their package.json — so the only
# thing missing is a release-age cooldown, set below.

[install]
# Refuse to install any package version published less than 3 days ago. Most
# supply-chain compromises are caught within hours, so a short cooldown dodges
# the bulk of them without slowing real work. Units are SECONDS (npm uses days,
# pnpm uses minutes — bun chose seconds). Verified honored on bun 1.3.14: it
# gates resolution (`bun add` / updates), not restoring already-locked versions,
# so `bun install --frozen-lockfile` in CI is unaffected.
#
# Caveats: `bunx`/`npx` do NOT respect this. For an urgent security fix that only
# exists in a just-published version, temporarily lower this or add the package
# to an excludes list (`minimumReleaseAgeExcludes`).
minimumReleaseAge = 259200

# First-party exemptions. The cooldown is a guard against THIRD-PARTY supply-chain
# compromise — a hijacked maintainer account, a typosquat, a malicious transitive
# bump. It buys nothing for a package published from this machine's own source by
# its own author, and it would stall every consumer repo for 3 days after each
# release. Only ever list packages published from ~/SourceRoot with npm provenance.
minimumReleaseAgeExcludes = ["basalt-ui"]

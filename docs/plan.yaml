version: 1
rows:
  - key: mini-registry
    issue: 1177

  - key: mini-apps-page
    checkpoint: spec
    title: The apps page starts and stops services - tier, state and footprint per service, a wake for a stopped on-demand door, an idle stop
    after: [mini-registry]
    facts:
      why: |-
        The apps page (docs/remote-dev.md, Dev-server doors) lists every door with live status but cannot start or stop anything, and a door whose app is down answers 502. The registry of row mini-registry knows each service's tier and its start and stop command. The owner wants to open a door and have the app come up, and to see and switch what runs on the mini from one page, so that dev servers and other on-demand services cost nothing while nobody uses them. The program is the Spec of Issue 1177 (section 2).
      what: |-
        scripts/caddy-tailnet.sh (the landing page and the generated include), a small local control endpoint as a bun service under launchd with its test (kuma-door/door.ts is the pattern), config/Caddyfile only where the wake route needs it, the registry entries for the endpoint and for the on-demand dev servers, docs/remote-dev.md. Not in scope: any app's own code, and the tiers of services that are not dev servers (their rows follow).
      change: |-
        1. The page shows per service its tier, state and footprint against budget (make mini-ps --format json) and a Start or Stop button. 2. The endpoint listens on 127.0.0.1 only and is reached through the wildcard tailnet site block and its ACL, as the page is today. It accepts start, stop and status for a registry name and runs only the registered command: no request value reaches a shell. A change needs POST and a same-origin check. It refuses to stop a core service and logs the caller address and the verb. 3. Wake: a request to a stopped on-demand door reaches the endpoint through Caddy's handle_errors on the upstream's 502, the endpoint starts the service and answers with a page that reloads until the door answers. A manual service gets the page with a Start button, never an automatic start. 4. Idle stop: a jobrun job stops an on-demand service whose door had no request for its idle window (30 minutes by default, a per-service value in the registry), read from Caddy's access log or a counter in the endpoint. 5. Register as on-demand the dev servers that have a .test door and a make target that starts them; name in the ship the doors that have none. The wake is for the owner's browser: leads keep validating against built output and never start a dev server.
      acceptance: |-
        With the basalt playground stopped, a plain request to its door starts it and the page loads within a minute; with the idle window shortened for the test it stops again. A request to a manual service's door does not start it. A request for an unknown name, or a verb the registry does not hold, is refused (a test). The ship has screenshots of the page at 1600x1100 and at 390 wide. make check passes and /review is clean.

  - key: linewatch-native
    repo: linewatch
    title: Run the linewatch app under launchd on the mini instead of in the Colima VM
    after: [mini-registry]
    facts:
      why: |-
        The mini's Colima VM held 4 to 6 GiB of host memory on 2026-11-14 for containers that use 0.6 GiB, and a vz VM never returns memory while it runs (Lima attaches the balloon device and never drives it). The VM can only be off by default once nothing always-on needs it. linewatch is one of three always-on personal containers there, at about 50 MiB, and its collector and watchdog already run natively under launchd (com.jkrumm.linewatch-collector-agent, com.jkrumm.linewatch-watchdog). The program is the Spec of Issue 1177 (section 3).
      what: |-
        docker-compose.yml, Dockerfile, the Makefile (deploy, verify, up, down), a launchd plist with its launch script (collector/run-agent.sh is the pattern), the data in the named volume linewatch-data, AGENTS.md and docs. The registry file at the repo root in the format the dotfiles row mini-registry documented.
      change: |-
        The app runs under launchd on 127.0.0.1:7731, the port its Caddy door already proxies, with secrets through secrets-run as the collector has them. Move the data out of the Docker volume to a host directory: stop the container, copy, compare row counts and the newest sample time, start the native service. Keep the volume untouched for seven days as the rollback and say in the ship how to go back. Nothing on the mini starts the container afterwards; the compose file may stay for local use. Register the service as core in the repo's registry file.
      acceptance: |-
        The door answers with the container stopped. Row counts and the newest sample time are equal before and after the move, stated in the ship. The heartbeat and watchdog jobs stay green for an hour. make check passes and the repo's verify is green.

  - key: rb-native
    issue: 1184

  - key: mini-docker-idle
    title: Docker off by default on the mini - brain-web from Caddy, dev databases as a profile, one 2 GiB VM that runs only while a service needs it
    after: [linewatch-native, rb-native]
    after_needs: shipped
    facts:
      why: |-
        A vz VM never returns memory while it runs: the Colima VM's host footprint climbs to its configured size and stays (5.6 GiB average on 2026-11-14 at a 6 GiB cap, for containers using 0.6 GiB). Only a stop returns it. With linewatch and rb native (the rows before this one), what is left in the VM is brain-web, the dev databases and the company's work services, none of which has to run all day. The program is the Spec of Issue 1177 (section 3); the container runtime is its open choice 2, so read that verdict first (Colima unless it says otherwise).
      what: |-
        config/Caddyfile (the brain door), colima/colima-start.sh and the homebrew.mxcl.colima job, the Makefile's COLIMA_MEMORY for the mini and the colima targets, the registry (needs vm, the dev-db profile), an idle check under jobrun, the devhost-health checks that expect Colima up, AGENTS.md, docs/remote-dev.md, docs/devhost-health.md, docs/brain-access.md. Other repos' compose files are theirs: file a signal where one should change.
      change: |-
        1. brain-web is nginx serving the static dist of ~/SourceRoot/basalt-ui-obsidian (apps/demo/dist, rebuilt every five minutes by com.jkrumm.brain-web-refresh). The brain door serves that directory with Caddy's file_server and reproduces what the repo's nginx.conf does (fallbacks, headers); the container is brought down through its repo's make target. 2. The dev databases of ~/SourceRoot/vps (mariadb is the only one running, about 100 MiB) become the manual profile dev-db: stopped now, started by make mini-profile NAME=dev-db UP=1. 3. The VM no longer starts at boot. make mini-up of a service with needs vm starts it first; an idle check stops it once no registered service that needs it has been up for 15 minutes. 4. COLIMA_MEMORY on the mini 4 to 2. The revert signal is the one docs/devhost-health.md names: a guest OOM kill or available under 1 GB, then 3. 5. The health checks treat a VM that is stopped because nothing needs it as healthy, and a VM that is down while a registered service needs it as a failure.
      acceptance: |-
        With no registered service that needs the VM up, no com.apple.Virtualization.VirtualMachine process of the default profile exists for 30 minutes and make doctor is green. The brain door answers from Caddy with the same page as before (status and a content hash of the index, and the iPhone path of docs/brain-access.md). make mini-up of one compose service brings the VM and the service up; the ship states the seconds it took. launchctl shows the Colima job does not start the VM at load. make check passes and /review is clean.

  - key: mini-work-profile
    title: The company's work services on the mini as one profile - down by default, one verb up and down
    after: [mini-docker-idle]
    facts:
      why: |-
        The company dashboard, the VPN container with its watcher, the token minters and the deploy gates run on the mini all day and are used a few times on a workday. They keep the VM up and hold launchd jobs that poll every 5 to 10 minutes. The owner wants them off unless he works with them. The program is the Spec of Issue 1177 (section 4). The teamchat sandbox is not part of this profile: it is on-demand and has its own row in its repo.
      what: |-
        The registry entries of the com.iu.* jobs and of the dashboard and VPN compose projects, the profile verb, docs/architecture.md and docs/remote-dev.md. The jobs and compose files belong to the company repos under ~/IuRoot: use their existing make targets and launchd labels, change none of their files, and file a signal to the owning repo where a stop target is missing.
      change: |-
        The profile work holds the dashboard, the VPN container and its watcher, the token minters, the deploy gates and the stack dashboard. make mini-profile NAME=work UP=0 stops the containers and boots the jobs out, and disables them so a boot does not bring them back; UP=1 enables and starts them in order (VM, VPN, minters, dashboard). A stale single sign-on session on the way up becomes an Errand through the existing ask-human path, not a silent failure. No page fires because the profile is down: list the monitors that watch these services in the ship, and file one signal to the repo that owns them if they cannot tell a planned stop from an outage. The profile is down after this row ships.
      acceptance: |-
        After UP=0 no process or container of the profile is left and, with nothing else needing it, the VM stops within its idle window. After UP=1 the dashboard door answers 200 given a valid session, and a stale session produces the Errand. launchctl print-disabled lists the profile's jobs while it is down. No monitor paged during a down period of an hour. make check passes and /review is clean.

  - key: teamchat-on-demand
    repo: epos-ai-teamchat-athena
    title: The sandbox runs in the mini's one VM and only while a run needs it
    after: [mini-docker-idle]
    facts:
      why: |-
        The sandbox has its own Colima profile on the mini: a 4 GiB VM that held 3.9 GiB of host memory on 2026-11-14 for three containers using 0.15 GiB, idle most of the day. A vz VM never returns memory while it runs; only a stop does. The owner decided against the separate VM (his annotation on the Spec of Issue 1050: the isolation costs more than it brings). The program is the Spec of Issue 1177 (section 4).
      what: |-
        The sandbox compose project (sandbox/), the scripts that keep the profile up (scripts/teamchat-vm-watch.sh, vm_watch.py, the autostart script) and their launchd jobs, the Makefile, the docs, and a registry file at the repo root in the format the dotfiles row mini-registry documented. The api, the broker and the funnel stay as they are.
      change: |-
        1. The sandbox compose project runs in the mini's default Colima profile. Name in the ship what it needs mounted; the VM's mounts are written by dotfiles (colima/apply-mounts.sh), so file a signal there for a mount. 2. On demand: the api starts the sandbox when a run needs it, through make -C ~/SourceRoot/dotfiles mini-up NAME=<the sandbox's registry name>, which starts the VM first; the run waits for readiness and the user sees that the sandbox is starting. The api stops it through make mini-down after 30 minutes without a run. 3. The watcher no longer keeps a VM up. The teamchat profile is stopped; say which of its volumes are caches and which hold state, move the state, and delete the profile seven days after the move if nothing was rolled back. 4. Lower the agent container's memory limit from 3 GiB to what it needs (it used 84 to 294 MiB when measured), so the 2 GiB VM holds it beside the dashboard.
      acceptance: |-
        A message that needs the sandbox while it is down gets its answer; the ship states the extra seconds. Thirty minutes after the last run the sandbox is down, and the VM too when nothing else needs it. colima list shows no running teamchat profile. The repo's own check and verify are green.

  - key: browser-shared
    title: One shared headless Chrome for UI checks - started on demand, one context per agent, stopped when idle
    after: [mini-registry]
    facts:
      why: |-
        Every browser subagent launches its own chrome-devtools-mcp and its own Chrome: about 135 MiB for the server, its npm wrapper and its watchdog, and 0.35 to 0.45 GiB for Chrome before a page loads, per agent. The MCP's 30 tool schemas cost 5,914 tokens on every request against about 22 for a CLI (measured by Octomind on 2026-10-02 with chrome-devtools-mcp 1.10.1). chrome-devtools-mcp has no idle timeout and leaves Chrome trees behind when its server is killed (its issues 3427 and 2621). The Spec named 1800x1200 as the size; the owner's note on it says 1600x1100 may be enough, so that is the default here and a repo whose own design bar names another size passes it per call. The program is the Spec of Issue 1177 (section 5); the research is agw run 01a1daac-bf88-741f-b84d-93f1af33193d (read it with agw run wait <id> --format json).
      what: |-
        agents/browser.md, skills/browse/SKILL.md, a supervisor script for the shared Chrome with its test, its registry entry (on-demand, idle 15 minutes), the opencode parity in config/opencode/opencode.json if it applies, AGENTS.md section MCP servers, docs/global-reference.md. Not in scope: basalt-ui's own harness (its layout and quality suites start their own Chrome inside test slots) and the research Chrome on port 9222.
      change: |-
        1. One headless Chrome with its own --user-data-dir under ~/.local/share and remote debugging on 127.0.0.1 at a registered port. An ensure command starts it when the browse path needs it. 2. The browser agent drives it with playwright-cli: attach to the CDP endpoint, one isolated context per agent session, viewport 1600x1100 by default (a call may name another size) set for that context and checked in the first screenshot (the research found that Playwright's CDP path passes no context options when it isolates, so verify the size instead of trusting the flag). 3. chrome-devtools-mcp stays in the agent's frontmatter for console, network and performance work, attached with --browserUrl instead of launching its own Chrome. 4. The supervisor closes a context idle for 15 minutes and stops Chrome when none is left; a crashed Chrome is restarted by the next ensure. 5. Load the installed versions' --help and docs before relying on a flag (research-first): the research rates the playwright-cli and page-routing flags medium, and their names changed between versions. If playwright-cli cannot attach with an isolated context, use Playwright MCP in HTTP mode with --cdp-endpoint and --isolated and say so. 6. The debugging port drives the browser for anything on the machine that can reach it: bind it to 127.0.0.1 and never sign that profile in anywhere.
      acceptance: |-
        Two browser agents in parallel use one Chrome tree (ps), a cookie set by one is absent in the other, and both screenshots are 1600x1100. Twenty minutes after the last use no Chrome of that profile runs. The ship states the tool-schema tokens of the browse path before and after. make check passes and /review is clean.

  - key: pg-buffers
    kind: chore
    title: Postgres shared_buffers 2 GB to 512 MB while weatherorb's jobs are disabled
    after: [mini-registry]
    facts:
      why: |-
        shared_buffers was sized for weatherorb's nearest-spot p95 (docs/postgres.md, docs/devhost-health.md section Memory budget). weatherorb's nine launchd jobs are disabled while V2 is built, and what is left is small: the databases shared (1.1 GB), agent_workflows (1.4 GB) and athena (115 MB) with about 20 connections. The buffers hold about 2 GiB that would come back as about 1.5 GiB. This is open choice 3 of the Spec of Issue 1177. Check its verdict before the change: if it keeps 2 GB, change nothing and close the Issue saying so.
      what: |-
        config/postgres/cluster.yaml (shared_buffers, and effective_cache_size if it should follow), docs/postgres.md, the table in docs/devhost-health.md. Applied with make pg-apply and one restart.
      change: |-
        shared_buffers 2GB to 512MB. The restart follows the stop-and-start pattern of scripts/pg-cutover.sh: detached, the factory's queue drained first and set back to run afterwards, the factory, agent-workflows and argo checked for a live connection after it. Write the revert signal into docs/postgres.md: weatherorb V2 states its own need when it serves again, and a rise in the factory API's latency goes back to 1 GB first.
      acceptance: |-
        SHOW shared_buffers answers 512MB. factory health get and the agent-workflows health are green after the restart and the queue state is run. The ship states the Postgres tree's footprint before and after, counted as the largest process plus the private rest, since every process's footprint counts the shared buffers again. make check passes.

  - key: core-restart-audit
    kind: docs
    title: Core restart audit - why hc-resume saw 18 core restarts since 2026-10-31, and whether recovery survives an app-triggered update
    facts:
      why: |-
        The incident doc (docs/incident-2026-11-13-mini-panic.md, standing constraint 2) says the Herdr app's auto-update has no off switch (herdr-app #207), so recovery must survive an app-triggered core update. ~/Library/Logs/hc-resume.log holds 18 "stream ended (core restart?)" lines since 2026-10-31, among them 2026-11-13T07:00:35Z followed by "no launchd-born core" for about a minute and 18 resumes at 07:02Z. Nobody has classified them, so "recovery is complete" is unproven for the restart class that happens most often.
      what: |-
        Read-only analysis: ~/Library/Logs/hc-resume.log (and its rotated files), the core's own log and launchd's record of com.jkrumm.herdr-core, the herdr-app updater log if one exists, make herdr-core-update history in git log and ~/Library/Logs. Output lands in docs/herdr-core.md as a new section "Core restarts, classified". Touches no script, no plist, no launcher, and does not run hc server restart, hc update or any live proof.
      change: |-
        Classify each stream-ended event as owner update (make herdr-core-update), app-triggered update, launchd respawn after a crash, host reboot, or unknown with the evidence that is missing. Per event, count terminals resumed (resume lines after it) versus terminals that had a jk.claude.session label, from the log alone. State from that data whether recovery after an app-triggered update was complete, and name the one extra log line or field that would make the next event measurable if the log cannot say. Do not change hc-resume (standing constraint 4).
      acceptance: |-
        docs/herdr-core.md has a table with one row per stream-ended event since 2026-10-31 (cause class, resumed count, evidence or "unknown: <what is missing>") and a closing line stating whether recovery survived an app-triggered update on the evidence; no file under scripts/ or config/ changes; make check passes.

  - key: recovery-check
    title: Measured recovery check - resumable terminals versus terminals running claude, read-only, run by the heartbeat after a boot
    after: [core-restart-audit]
    facts:
      why: |-
        After the 2026-11-13 panic reboot hc-resume fired 25 resumes within 9 ms and 5 minutes later only 10 terminals showed as claude-code, so recovery is not proven complete. Nothing computes "resumable versus running" today; the only way to know is to read terminals by hand. The incident doc's recovery target is explicitly measured, not assumed.
      what: |-
        New scripts/recovery-check.ts (or .sh, matching scripts/lib/core-health.sh style) with a fixture-driven test, a make recovery-check target, a bounded recovery sub-check in scripts/devhost-health-check.sh (the core component, near check_core) with its test in scripts/devhost-heartbeat.test.sh, docs/devhost-health.md and the remote-dev skill/doc line that says how to read it. Does not edit scripts/hc-resume.ts, the core's plist, launcher or any make herdr-core-* target.
      change: |-
        The check is read-only. It runs scripts/lib/core-up.sh first and does nothing when no launchd-born core answers (hc would start a core). Then it lists terminals and counts: resumable (kept terminal with a jk.claude.session label), running (foreground is claude), waiting (resumable and foreground still a login shell), per-terminal last hc-resume verdict from ~/Library/Logs/hc-resume.log (sent at, or skipped with the reason). One line for people (recovery: 25 resumable, 10 running claude, 12 waiting, 3 skipped) and --json. The heartbeat runs it only while the host booted less than 45 minutes ago, appends the counts to ~/Library/Logs/devhost-snapshots.jsonl, and from 10 minutes after tailnet-up reports a WARN (never a FAIL, never a DOWN) when running is less than resumable; an env knob DEVHOST_RECOVERY=0 turns the sub-check off. Every hc call is bounded at 5 s like the other sub-tools. Rollback: revert the commit; the sub-check is additive and gated by the knob.
      acceptance: |-
        Tests cover the count from a fixture of hc terminal records (all running, some waiting, no label, core not up = no hc call), the WARN threshold and the booted-less-than-45-minutes gate; make recovery-check prints the line on the live mini without touching the core (read verbs only); docs/devhost-health.md explains the three numbers and the expected curve; /review is clean; make check passes. No reboot, kill or core restart is used to prove it.

  - key: kuma-fast-alert
    repo: homelab
    title: Page the owner when the mini's door does not answer for about 3 minutes (the Dev Host push monitors only page after 20)
    facts:
      why: |-
        The Dev Host push monitors have interval 600 s and maxretries 1 (time to DOWN about 20 minutes) and went PENDING and back during the 2026-11-13 panic without a page; an outage under 10 minutes never reaches DOWN. The door leaf monitors do notice in about 4 minutes (interval 120, maxretries 2, retry 60) but route to the factory door, and the factory runs on the mini, so a dead mini pages nobody for 30 minutes. dotfiles docs/devhost-health.md "Why a push at all" records the gap; the reboot push of dotfiles issue 1034 only tells the owner after the mini is back.
      what: |-
        homelab/uptime-kuma/monitors.yaml (one new leaf monitor, listed in settings.watchers like the push monitors so it keeps the direct ntfy page), homelab docs/ntfy.md "Kuma alert routing" table (make test fails when it does not list exactly the watchers), and the mini-door generated file only if the leaf belongs next to the door group. Nothing on the mini and nothing in the door.
      change: |-
        Add a pull monitor "MacMini Door - Reachable": GET https://${MINI_TAILSCALE_HOST}:8795/healthz (the door's own liveness, no new ACL grant), interval 60, timeout 30, maxretries 2, retry_interval 60, accepted 200-299, so DOWN comes after about 3 to 4 minutes of an unreachable or starved host. Watcher, so it pages ntfy directly; a recovery sends the usual UP. Apply with sync.py on the homelab (its header comment). State in docs/ntfy.md that a planned reboot pages once and that this monitor says "unreachable", where the 1034 push says "rebooted". Rollback: delete the monitor entry and run sync.py again.
      acceptance: |-
        make test passes in homelab (watchers list and the ntfy.md table agree); sync.py applied and the monitor is UP in Kuma, shown by the monitor's last heartbeat; the monitor entry names its time to DOWN in a comment (interval plus retries); /review is clean. No outage is staged to prove it.

  - key: recovery-drill
    kind: docs
    title: Recovery drill for the owner - how to read recovery after any reboot, and a quiet-window drill that never breaks the core
    after: [recovery-check, core-restart-audit, kuma-fast-alert]
    facts:
      why: |-
        The standing constraint forbids proving recovery by rebooting or restarting the core, so the only live proofs are the next real reboot and an owner-chosen quiet window. Today there is no page that says what to look at, in what order, or what a good curve is. The detection side also changed (reboot push, door monitor, recovery check) and docs/devhost-health.md still says an outage under 10 minutes reaches nobody.
      what: |-
        New docs/recovery-drill.md; one-line pointers from docs/incident-2026-11-13-mini-panic.md, docs/herdr-core.md and the remote-dev skill; docs/devhost-health.md paragraph "Why a push at all" brought in line with the door monitor. Docs only.
      change: |-
        Write three parts. (1) After any reboot, read-only: the order of what to read (reboot push, make recovery-check, hc-resume.log pacing lines, devhost-snapshots.jsonl), what the three numbers mean, and the expected curve from docs/herdr-core.md. (2) The owner's controlled drill in a quiet window, by hand: preconditions (Data volume under 85%, no factory leads running, recovery-check baseline taken, a time chosen), the one command the owner runs by hand, what to read afterwards, and what counts as pass; stated plainly that no agent runs it (herdr-core-guard denies it) and that the result is a measured line pasted back. (3) The scratch-core proof of hc-resume logic (own HC_SESSION and XDG paths, the Wave 3 recipe in docs/herdr-core.md) as the drill that never touches the production core, also owner-run.
      acceptance: |-
        docs/recovery-drill.md exists with the three parts and a worked example line from make recovery-check; the three pointers and the corrected devhost-health.md paragraph are in; no command in the doc is one herdr-core-guard allows an agent to run that restarts, stops or updates the core; make check passes.

  - key: ssd-prep
    kind: chore
    checkpoint: spec
    title: External SSD on the mini - the volume contract (mount order, absent tolerance, TCC, what stays off it, disk budget), path-agnostic
    facts:
      placement: |-
        Owner decision of 2026-11-14 (dotfiles issue 1119): the drive is attached and mounted (about 572 GiB free). What moves to it first is weatherorb's raw data: its V1 data/ and products/ directories and ~/orb, about 184 GB together. Postgres (data dir on the internal disk, so an unplugged drive never stops the factory), Docker and the Colima VM disk, swap, and everything the factory and the boot path need stay on the internal SSD. The drive's weatherorb data keeps whatever backup it had before the move. docs/postgres.md and docs/disk.md name the split.
      why: |-
        The owner is attaching a 1 TB external SSD to the mini for bulk data, first the weatherorb data (weatherorb's own plan row v2-host names the data root and needs about 228 GB while the internal disk has about 131 GiB free), maybe more later. Owner verdict on the first plan: the drive (volume name "HDD USB EXT") already holds data he does not want to lose, it is encrypted and its secret exists, so it is kept and unlocked, never reformatted by a lead; if its format turns out unsuitable that is a Decision, and cleaning it up is his call. It is attached now (placement above); the contract still stays path-agnostic. A volume that can be absent, locked or half-mounted at boot or after a USB hiccup, read by launchd jobs that today assume their paths exist, is a new failure class on the box that just panicked; the contract has to exist before the first byte moves.
      what: |-
        New docs/external-ssd.md, scripts/lib/volume-gate.sh with scripts/volume-gate.test.sh, config/external-volume.json (name, sentinel file, attached: false), a doctor and heartbeat check "external volume" that is a no-op while attached is false, a new class in config/tcc-programs.json and scripts/tcc-check (or docs/tcc.md if the check needs no code) for programs that touch a removable volume, docs/disk.md (a per-owner row class "external"), AGENTS.md line. No mount path, no device name, no data move; tests use a temporary directory as the stand-in volume.
      change: |-
        Write the Spec first (checkpoint); it states the rule that no lead formats, erases or converts the drive, and how an encrypted volume is unlocked headless (the passphrase as a ref in dotfiles-private/headless.refs resolved through the secrets cache and secrets-run, handed to diskutil over stdin never argv, never op on the mini; a missing ref goes through make secrets-reseal-request). Then build the path-agnostic parts: the gate (a job calls it before touching the volume: present = the mount is there, unlocked, and the sentinel file at its root is readable; absent or locked = exit 0 with one "skipped: volume absent" or "skipped: volume locked" line, never mkdir -p on the missing path, never fall back to the internal disk); the unlock job design (a launchd agent on volume arrival and at login, bounded, idempotent, logging to ~/Library/Logs, off the boot path); the doctor and heartbeat check (WARN while the volume is absent or locked and attached is true, never FAIL, never in the composite liveness push); the TCC class and the program list that needs the Removable Volumes grant, with the probe command; the keep-off list (swap and the VM disk, ~/.colima, herdr-core state and logs, ~/Library/Logs, the secrets cache, LaunchAgent programs, anything the boot path needs); Spotlight off (mdutil) and Time Machine exclusion (tmutil addexclusion) as steps; the format check as a read-only procedure for when the drive is attached (diskutil info and apfs list: file system, encryption, free space, what is on it by top-level size, nothing deleted) with the outcomes it leads to (APFS encrypted: keep; HFS+, exFAT or MBR: Decision, with copy-off to a HomeLab share first); and the disk budget table (internal after the move, SSD headroom, where Postgres and weatherorb data land is weatherorb's choice). Docker: the Colima VM disk and named volumes stay on the internal disk (the VM is on the boot path); a bind mount of an SSD directory into containers is allowed only behind the gate, and the Spec names which candidate volumes (sizes from docs/disk.md) could move later, as a follow-up question, not a task.
      acceptance: |-
        The Spec is submitted before the code; volume-gate.test.sh proves present, absent and locked (exit 0, nothing created on the internal disk), sentinel missing, and a path that vanishes mid-run; no code path formats, erases or converts a volume; doctor and heartbeat checks are silent while attached is false; docs/external-ssd.md carries the mount-order rule (dependents gate themselves, launchd has no mount dependency), the keep-off list and the TCC steps; docs/disk.md has the external class; /review is clean; make check passes. No path to the SSD appears in any tracked file.

  - key: ssd-adopt
    kind: chore
    title: Adopt the external SSD as attached - grants, exclusions, budget, its two roles (weatherorb data and the HomeLab mirror)
    after: [ssd-prep]
    facts:
      attached: |-
        Measured 2026-11-14 on the mini: the volume is named EXT (the earlier name "HDD USB EXT" is gone), APFS, FileVault on and unlocked, owners disabled, USB, 931 GiB with 526 used. weatherorb moved its V1 data there the same day (weatherorb commit a89d3154: weatherorb/, 167 GiB, with its own marker file at weatherorb/.weatherorb-data-root), before this contract existed. The owner's data at the volume root: Fuji RAWs 169 GiB and Fuji videos 110 GiB (6320 and 418 files, each identical by name and size to the HomeLab's HDD/fuji), and about 22 GiB of personal folders that exist nowhere else. The mini rebooted on 2026-11-13 and the volume is unlocked now: find out what unlocked it (login keychain or a hand) before designing around a locked volume.
      why: |-
        docs/storage.md is the owner's storage map of 2026-11-14: the volume is the home of nothing. It holds weatherorb's working data and mirror/, a nightly pulled copy of the HomeLab's SSD share and of HDD/fuji (row ext-mirror). ssd-prep delivers the contract with no volume attached; this row turns it on for the real volume, which is already in use without a gate.
      what: |-
        config/external-volume.json (attached: true, the volume name and sentinel; the mount point is read at run time, never written into tracked files), config/tcc-programs.json entries for the programs that write there, docs/disk.md measured row, docs/external-ssd.md "as attached" section with the date, docs/storage.md if a number changed. No Errand to attach: it is attached.
      change: |-
        Read-only first: diskutil info and apfs list, top-level sizes, free space; write the findings in docs/external-ssd.md. Never format, erase or convert, and do not move, rename or delete any of the owner's folders: the personal folders go to the HomeLab in the homelab row storage-consolidate, the Fuji folders become mirror/fuji in the row ext-mirror. Reserve the layout: weatherorb/ and mirror/ are the only top-level directories the volume keeps in the end. Find the passphrase ref (a 1Password item the owner names if it cannot be found; add it to dotfiles-private/headless.refs and run make secrets-reseal-request), install the unlock job from ssd-prep, write the sentinel file, set mdutil -i off and tmutil addexclusion, run the TCC probe for each program in the list and record the result, turn the doctor and heartbeat check on, measure free space and write the disk.md row. Prove absent and locked tolerance with diskutil unmount and mount in a window where no weatherorb job writes (ask its lead by signal for the window), never by reboot or cable pull. File one signal on weatherorb (factory signal file --repo weatherorb): the contract, the sentinel, and the ask that its jobs call the gate before they touch weatherorb/ instead of trusting their own marker alone.
      acceptance: |-
        docs/external-ssd.md records the drive's file system, encryption, free space and top-level contents, and nothing on the drive was changed except the sentinel file; make doctor shows the external volume check OK with the volume mounted and unlocked and WARN after diskutil unmount (then OK after mount, the unlock job having re-unlocked it); make tcc-check passes with the new programs listed; docs/disk.md has the measured row; the weatherorb signal is filed and named in the ship; no mount path or device identifier in any tracked file; /review is clean; make check passes.

  - key: smb-mini-homelab
    kind: feature
    title: Self-healing HomeLab Samba mount on the mini, the way the MacBook has it
    facts:
      why: |-
        Owner verdict on the first plan: he wants a Samba connection that heals itself between the HomeLab and the mini, as the MacBook has with com.jkrumm.smb-keepalive (docs/macbook.md "HomeLab Samba"). The mini reaches the HomeLab only through hl (S3) and ssh today, so a bulk copy to or from the HomeLab shares (SSD, HDD) has no mounted path. macOS never reconnects an SMB mount after sleep or a network change, and a stale mount blocks the first stat that touches it.
      what: |-
        smb/smb-keepalive.sh and smb/com.jkrumm.smb-keepalive.plist.template (generalised only as far as a headless host needs), a Makefile setup target for the mini, dotfiles-private/smb-shares.conf (server names live there, never in a tracked file), the credential through the secrets cache and secrets-run instead of the Keychain entry Finder saved (the mini has no Finder session; never op), config/tcc-programs.json, docs/macbook.md or docs/remote-dev.md, docs/background-jobs.md. Does not touch the core, its plist or launcher.
      change: |-
        Run the keepalive on the mini under jobrun with the same behaviour: port 445 unreachable means skip, a mounted share whose bounded stat and ls hangs or fails is force-unmounted and remounted, absent with automount yes is mounted, every call bounded and a hung one abandoned. Mount points under the user's home, never created when the mount fails. The job is off the boot path: a HomeLab that is down at boot delays nothing and fails nothing (exit 0 with one skipped line). Register it with jobs-grade. A missing secrets ref goes through make secrets-reseal-request. Rollback: make target to unload the agent and remove the plist; the shares are only mounts.
      acceptance: |-
        A share is mounted on the mini after make setup; after diskutil unmount force of it the next run (within 60 s) remounts it; a test with a hanging stat fixture proves the bounded unmount and remount path; with the HomeLab unreachable the job exits 0 and reports skipped; jobs-grade lists the job; no server name, user name or password in a tracked file; /review is clean; make check passes.

  - key: smb-ssd-share
    kind: feature
    title: Serve the external SSD from the mini over Samba as EXT, and automount both mini shares on the MacBook
    after: [ssd-adopt, smb-mini-homelab]
    facts:
      why: |-
        The owner wants every drive of his on the MacBook without a manual step: the HomeLab's SSD and HDD (done, dotfiles-private/smb-shares.conf automounts both), the mini's home share with ~/Shuttle (mounted by hand today, not in the keepalive) and the external SSD. The mini already serves its home through macOS smbd on 445 (tailnet tag:mac to tag:mac), so the transport and the ACL exist. The mount table is in docs/storage.md "Mounts". A share named EXT mounts on the MacBook at /Volumes/EXT, the path the drive had while it was plugged into the MacBook, which is the RAW root Shutterflow has configured there (shutterflow docs/poc-backlog.md).
      what: |-
        The macOS sharing configuration for one share point named EXT at the volume root (sharing -a needs root: look first for a root-free way, raise an Errand with --tried only when there is none), two rows for the MacBook in dotfiles-private/smb-shares.conf (EXT and the home share, automount yes, scope macbook; the MacBook side through ask-human.sh ask --cmd), docs/external-ssd.md, docs/macbook.md, docs/storage.md. The tailnet ACL is unchanged unless a grant is missing (dotfiles-private/tailscale-acl.jsonc, then the biometric-gated apply).
      change: |-
        Add the share on the mini only after the volume gate reports present and unlocked, with the share point inside the volume so an absent volume exposes nothing on the internal disk. The MacBook's keepalive mounts both mini shares like the HomeLab ones; it needs the login Keychain entry Finder saves, so the first mount per server is one Errand (mount once in Finder with Remember), checked before automount is switched to yes: a row that cannot mount makes the job fail every minute and files a background-job Issue. Users and permissions as the home share has them. Rollback: remove the share point and the conf rows; the data is untouched.
      acceptance: |-
        From the MacBook, EXT and the home share mount without a manual step after a MacBook reboot (keepalive log); after the volume is unmounted on the mini and mounted again the MacBook mount recovers by itself (keepalive log, no reboot or cable pull used); with the volume absent the share lists nothing and the internal disk is not written; docs/storage.md "Mounts" matches what is live; no server name or user name in a tracked file; /review is clean; make check passes.

  - key: storage-consolidate
    kind: chore
    repo: homelab
    checkpoint: spec
    title: One home per data class - move the single-copy folders off the mini's external SSD, retire the second film copy and the stale photo staging, fix the storage docs
    facts:
      why: |-
        dotfiles docs/storage.md (2026-11-14) is the owner's storage map: the SSD share is the home of documents and photos, the HDD share of the big media, and every other copy is made by a job. A content-hash pass that day found less duplication than feared and one real gap. (1) About 22 GiB of personal folders at the root of the mini's external volume (tax and private documents, a rescued USB stick with its report directory, drone and project videos) exist nowhere on the HomeLab and are in no backup. (2) /mnt/transfer/Filme, 2.0 TiB on a second partition of the same physical disk as /mnt/hdd, frozen since 2025-01: all 212 film, 40 series and 102 kids titles also exist by name under /mnt/hdd/Filme. (3) ~/ssd/SSD/Bilder/Staging (26.6 GiB) shares 13.1 GiB of identical files with Bilder/Fuji; both are the pre-Shutterflow copies that shutterflow docs/your-migration.md calls no longer refreshed, and Bilder/Fuji is Immich's external library. (4) Directories on /mnt/hdd that look like leftovers of retired services (photo_archive is empty; others hold kilobytes).
      what: |-
        Data on the HomeLab shares and on the mini's external volume (reached from the mini, where leads run: the volume is local there, the HomeLab is hl over S3 and ssh homelab). Tracked files: this repo's AGENTS.md "Storage Layout", docs/backups.md, README.md storage sections. Directories bound by a container of any other compose project on the host are not this Issue's, whatever they are called: read the binds of every running container first.
      change: |-
        Spec first, one page, a table per step with sizes and the exact source and destination, because every step ends in a deletion and deletions are the owner's. Step 1: copy the single-copy folders from the external volume into the SSD share under the class they belong to (documents under Dokumente/, videos under Videos/, the rescued stick as one dated archive folder under Dokumente/ unless its report says what to merge), with hl from the mini (its key cannot delete on the HomeLab), then sha256 both sides, then wait for the next restic snapshot and show the files in it (restic ls), and only then remove them from the volume. A certificate or key file among them is copied like the rest and named in the Spec so the owner can move it to 1Password. Step 2: prove file by file (relative path and size) that everything under /mnt/transfer/Filme exists under /mnt/hdd/Filme, list what does not, copy those over, then delete the partition's content after approval. The partition itself, its fstab line and any repartitioning stay as they are: a lead never repartitions. Step 3: in Bilder/Staging remove only the files byte-identical to a file in Bilder/Fuji; leave Bilder/Fuji (Immich reads it) and the rest of Staging, and ask in the Spec whether the stale remainder should go. Step 4: list the leftover directories with size, last write and the container that binds them; remove those nothing binds. Step 5: the docs: the mount table and tree in AGENTS.md (the transfer partition's real state, RAW archive 169 GiB not 118, no Obsidian sync target, no path-level restic excludes), one line pointing at dotfiles docs/storage.md as the map. Nothing is deleted before the Spec has a verdict; with no verdict the copies of step 1 are made and every deletion waits.
      acceptance: |-
        Every folder that was single-copy on the external volume is on the SSD share with matching sha256 and visible in a restic snapshot before its original is removed; the ship lists per step what was copied, what was deleted and what waits for the owner; no file was deleted that the approved Spec did not name; Immich's external library still lists its assets; AGENTS.md and docs/backups.md match the disk; make check passes.

  - key: restic-verify
    kind: feature
    repo: homelab
    title: Restic proves itself - a scheduled integrity check, a monthly restore drill from B2 with a push monitor, a pinned image
    facts:
      why: |-
        The nightly backup is healthy (2026-11-14 03:30: 162,685 files, 382 GiB, 26 snapshots since 2026-05, the Kuma push monitor green), but nothing proves the repository can be read back. docs/backups.md records one restic check and one restore drill, both on 2026-05-04 and both by hand from the Mac with op. Forget runs nightly without prune; prune needs the master key from the Mac and its last run is not recorded. The image is mazzolino/restic:latest, unpinned, on the one container that holds the offsite copy.
      what: |-
        docker-compose.yml (service restic-backup), scripts/ (a new restic-restore-check.sh), uptime-kuma/monitors.yaml, docs/backups.md, Makefile restic targets. The sources and excludes stay as they are (adding HDD/fuji/Videos is an open owner decision in dotfiles docs/storage.md).
      change: |-
        A weekly restic check and a monthly restic check --read-data-subset sized so a year reads the whole repository, scheduled the way the image supports it (read the image's own README for its check variables; do not trust this sentence) or from the jkrumm crontab through docker exec, each with a push to its own Kuma monitor and the failure visible in the log. A monthly restore drill, scripts/restic-restore-check.sh: with the append-only key, restore a fixed sample from the newest snapshot into a temporary directory on the HomeLab (a few files per source chosen by a seeded shuffle, plus the newest Immich database dump), compare sha256 with the live files, gunzip -t the dump, remove the directory, push status. Pin the image to a version. In docs/backups.md: the three schedules, how to read when prune is due (restic stats raw-data against the snapshot size) and the date of the last prune once the owner has run one, and the stale lines corrected (the RAW archive is 169 GiB, the Obsidian sync target is gone).
      acceptance: |-
        restic check ran once from the new schedule and its monitor is up; the restore drill restored and matched its sample against a snapshot from B2 (the output is in the ship) and its monitor is up; a drill against a deliberately wrong sample hash exits non-zero and pushes down; the image is pinned and the nightly backup after the change succeeded; docs/backups.md names the schedules; make check passes.

  - key: ext-mirror
    kind: feature
    title: Nightly mirror of the HomeLab's SSD share and HDD/fuji onto the mini's external SSD, pulled over S3 behind the volume gate
    after: [ssd-adopt, storage-consolidate]
    facts:
      why: |-
        docs/storage.md: the external volume is the second local copy of everything that must not be lost. The HomeLab's HDD is one USB disk without redundancy that re-enumerated twice in 2026-10, and the SSD share has no local copy at all. Today the volume holds a hand-made copy of HDD/fuji (identical by name and size, 280 GiB) and nothing of the SSD share (164 GiB). A copy made by hand goes stale; this job makes it.
      what: |-
        A script under scripts/ with its test, a launchd plist template under jobrun, a Makefile setup, status and teardown target, config/tcc-programs.json (class removable), docs/storage.md, docs/external-ssd.md, docs/background-jobs.md, docs/architecture.md job row. Uses hl (scripts/hl: rclone against the HomeLab's S3 gateway; the mini's key reads and writes, cannot delete) and scripts/lib/volume-gate.sh.
      change: |-
        Nightly, off the boot path, after the HomeLab's 03:30 restic run: behind the volume gate (absent or locked = one skipped line, exit 0, nothing written to the internal disk), sync homelab:ssd to <volume>/mirror/ssd and homelab:hdd/fuji to <volume>/mirror/fuji. A file changed or deleted at the source moves to <volume>/mirror/.deleted/<date>/ (rclone --backup-dir) and is removed after 30 days, so a mistake at home is not mirrored into the only local copy the same night. Exclude what restic excludes (homelab restic-excludes.txt: trash, Immich thumbs and encoded video, the gateway's .sgwtmp). HomeLab unreachable = skipped, exit 0; a sync that ran and failed = non-zero, graded by jobs-grade. Refuse to start below a free-space floor and say so. After each run write <volume>/mirror/.status.json (started, finished, per source: files, bytes, transferred, errors). The gateway gives Samba-written files no usable etag (homelab docs/s3.md Caveats), so comparison is size and modification time; add a monthly rclone check --download over a seeded sample and record what it found. First run: the volume already holds the Fuji copy as Bilder/RAWs and Videos/Videos. If the owner's decision in docs/storage.md "Open" stands at its default (the RAW root is on the HomeLab), rename those two into mirror/fuji/RAWs and mirror/fuji/Videos (same volume, no copy) so the first sync verifies instead of copying 280 GiB; if he chose to keep the RAW root on the volume, leave Bilder/ alone and mirror only the SSD share. Read that table before the first run and state in the ship which case applied.
      acceptance: |-
        After one run <volume>/mirror/ssd and mirror/fuji match their sources by file count and bytes (rclone check, size only, output in the ship); a file deleted in a test folder on the share appears under mirror/.deleted/ on the next run and the source of truth is untouched; with the volume unmounted the job logs skipped and exits 0 and nothing appears on the internal disk; with the HomeLab unreachable it exits 0 skipped; jobs-grade lists the job; .status.json is written; docs/storage.md "Copies" no longer says not built yet; /review is clean; make check passes.

  - key: storage-status
    kind: feature
    title: One storage status - shares, mounts, free space, mirror and backup age as JSON, in make doctor and for the Tinycast command
    after: [ext-mirror, smb-ssd-share]
    facts:
      why: |-
        The owner wants to see at a glance that his drives are connected and his copies are fresh, on the MacBook in Tinycast and on either Mac in the terminal. The facts exist in four places (the mount table, the keepalive's log and jobrun state, the mirror's status file, the Kuma monitors) and nothing puts them on one page.
      what: |-
        scripts/storage-status.sh with a test, make storage-status, a check in scripts/doctor.sh, docs/storage.md (a "Status" section with the JSON contract). The Tinycast command itself is not in this row: tinycast-extensions is not a factory project and deploys on the MacBook; it is built afterwards from an owner session against the contract this row documents.
      change: |-
        storage-status.sh prints a table, and with --json one object: per share declared in dotfiles-private/smb-shares.conf for this host: reachable on 445, mounted, mount point, healthy (the keepalive's bounded probe, reused, never a bare stat on a stale mount), free and total bytes from the mounted file system; the keepalive's last run and grade from its jobrun state; on the mini the external volume's state from the gate and the mirror's .status.json with its age; the age of the last restic success if it can be read without a new credential (the mirror's copy of a status file, or the Kuma monitor through access that already exists), else left out and said so. Every probe bounded; the command never hangs on a dead mount and never mounts anything. The doctor check warns on a declared automount share that is not healthy, and on the mini on a mirror older than 36 hours; never FAIL, not in the liveness push. No server name in the output's tracked examples.
      acceptance: |-
        make storage-status on the mini shows both HomeLab shares healthy with free space, the external volume present and the mirror's age; with a share force-unmounted it shows it unmounted without hanging (test with the hanging stat fixture); --json validates against the contract in docs/storage.md; make doctor carries the check; /review is clean; make check passes.

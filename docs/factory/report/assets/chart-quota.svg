<g><title>2026-10-14: peak 98 %, 4.5 h at or above 90 %</title><path d="M702.0 400.0V186.9a4.0 4.0 0 0 1 4.0 -4.0H754.0a4.0 4.0 0 0 1 4.0 4.0V400.0Z" class="f1 gap"/></g>

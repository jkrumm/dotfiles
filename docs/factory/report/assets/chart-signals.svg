<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-labelledby="signals-per-month-via-slack-relays-vs-di-t signals-per-month-via-slack-relays-vs-di-d">
<title id="signals-per-month-via-slack-relays-vs-di-t">Signals per month: via Slack relays vs direct to the ledger</title>
<desc id="signals-per-month-via-slack-relays-vs-di-d">Stacked bars per month. 2026-04: 0 relayed, 7 direct; 2026-05: 107 relayed, 58 direct; 2026-06: 75 relayed, 6 direct; 2026-07: 236 relayed, 13 direct; 2026-08: 212 relayed, 51 direct; 2026-09: 304 relayed, 130 direct; 2026-10: 187 relayed, 202 direct. Over all months 71 % of signals arrive via Slack relays.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-labelledby="baseline-kpis-vs-targets-autonomy-escala-t baseline-kpis-vs-targets-autonomy-escala-d">
<title id="baseline-kpis-vs-targets-autonomy-escala-t">Baseline KPIs vs targets: autonomy, escalated share, reopen, regression, time to resolve</title>
<desc id="baseline-kpis-vs-targets-autonomy-escala-d">Five panels, each with three bars for the last 14 days, last 30 days and all time, and the target as a dashed line. Autonomy: 14 d 64.3 %, 30 d 52.2 %, all 52.5 % (target SLO 99 %, stretch 99.9 %). Escalated share: 14 d 32.2 %, 30 d 28.8 %, all 20.5 % (target SLO &lt; 1 %). Reopen rate: 14 d 10.4 %, 30 d 15.3 %, all 17.5 % (target target ≤ 5 %). Regression rate: 14 d n/a, 30 d n/a, all 10.4 % (target target ≤ 5 %). Time to resolve, median: 14 d 0.72 h, 30 d 1.10 h, all 1.68 h (target target ≤ 0.5 h).</desc>

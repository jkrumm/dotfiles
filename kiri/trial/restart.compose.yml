# restart: unless-stopped, with a counter on a named volume so a restart is visible.
services:
  restarter:
    image: alpine:3.20
    restart: unless-stopped
    command: sh -c "n=$$(cat /data/n 2>/dev/null || echo 0); echo $$((n+1)) > /data/n; echo start $$((n+1)); sleep 86400"
    volumes:
      - restart-data:/data

volumes:
  restart-data:

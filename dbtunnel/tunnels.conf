# Persistent SSH port-forwards from the MacBook into the mini — the declared
# state, applied by `make db-tunnel-setup` (dbtunnel/db-tunnel.sh).
#
# Why this exists rather than a tailnet listener: the mini's dev databases bind
# `127.0.0.1` in their compose files, deliberately. A forward keeps that true —
# the port is reachable from this machine's loopback and nowhere else, and the
# auth in front of it is an SSH key rather than a compose-file default password.
# `tailscale serve --tcp 3306` would publish a raw MySQL socket to every tagged
# device on the tailnet guarded by `root`/`toor`; the port choice IS the access
# control decision, same argument as the collie row in tailscale-serve.mini.conf.
#
# Caddy cannot do this at all: MySQL is not HTTP, and this build ships no
# layer4 module (`caddy list-modules | grep layer4` is empty).
#
# LOCAL PORTS ARE OFFSET BY 30000 from the service's real port, because this
# machine runs its OWN copy of the same dev stack — colima has idss-mysql on
# 3306 and idss-valkey on 6379 locally. A forward on the real port would either
# fail to bind or, worse, silently shadow the local one and leave you querying
# the wrong database. The offset makes "which side am I on" unambiguous.
#
# All rows must share one SSH host: launchd supervises a single ssh process
# holding every forward. The script fails loudly rather than silently dropping
# rows if that stops being true.
#
# local  ssh_host  remote_host  remote_port  label
33306    mini      127.0.0.1    3306         idss-mysql (studentenrolment, care-replica)
36379    mini      127.0.0.1    6379         idss-valkey
